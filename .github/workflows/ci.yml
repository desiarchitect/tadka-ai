name: ci
on:
  push:
  pull_request:

jobs:
  test:
    # Node 24 is the required baseline. Node 26 is a compatibility check and may fail without failing the workflow.
    name: node ${{ matrix.node }}
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.node == 26 }}
    strategy:
      fail-fast: false
      matrix:
        node: [24, 26]
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: tadka
          POSTGRES_PASSWORD: tadka_local
          POSTGRES_DB: tadka
        ports: ["5544:5432"]
        options: >-
          --health-cmd "pg_isready -U tadka -d tadka"
          --health-interval 2s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # Node 25 and later no longer ship corepack, so pnpm comes from npm on both versions.
      - run: npm install -g pnpm@12.11.2
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
