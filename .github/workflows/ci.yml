name: ci
on:
  push:
  pull_request:

jobs:
  test:
    # Node 24 and 26 are both in `engines`, so both are tested. A failure on one is not hidden by the other.
    name: node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [24, 26]
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: tadka
          POSTGRES_PASSWORD: tadka_local
          POSTGRES_DB: tadka
        ports: ["5544:5432"]
        options: >-
          --health-cmd "pg_isready -U tadka -d tadka"
          --health-interval 2s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      # Typechecks every app, then builds the web client (demo sign-in off, as in production).
      - run: pnpm build
      # Builds the client with and without VITE_DEMO_LOGIN and searches the output for the demo credentials.
      - run: pnpm --filter @tadka/web check:bundle
