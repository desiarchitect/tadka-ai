# Local infrastructure for Tadka TS. Credentials are local-only defaults.
services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: tadka-ai-postgres
    environment:
      POSTGRES_USER: tadka
      POSTGRES_PASSWORD: tadka_local
      POSTGRES_DB: tadka
    ports: ["5544:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tadka -d tadka"]
      interval: 2s
      retries: 30
    volumes: [pgdata:/var/lib/postgresql/data]

  # Jaeger accepts OTLP directly, so M0 skips a separate collector.
  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    container_name: tadka-ai-jaeger
    profiles: [observability]
    ports:
      - "16686:16686" # UI
      - "4318:4318"   # OTLP over HTTP

volumes:
  pgdata:
